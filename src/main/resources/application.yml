server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: walletflow

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  docker:
    compose:
      enabled: false


app:
  rate-limit:
    login:
      block-duration: ${LOGIN_RATE_LIMIT_BLOCK_DURATION}
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS}
      duration: ${LOGIN_RATE_LIMIT_DURATION}
    password-reset:
      max-requests-per-email: ${PASSWORD_RESET_RATE_LIMIT_MAX_PER_EMAIL}
      duration: ${PASSWORD_RESET_RATE_LIMIT_DURATION}
      cooldown-duration: ${PASSWORD_RESET_COOLDOWN_DURATION}
